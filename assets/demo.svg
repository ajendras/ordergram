<svg xmlns="http://www.w3.org/2000/svg" width="900" height="572" viewBox="0 0 900 572" role="img" aria-label="OrderGram — demo">
  <style>
    text{font-family:ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace;font-size:15px}
    .l{opacity:0}
    .ty{clip-path:inset(0 100% 0 0)}
    .cur{animation:blink 1s steps(1) infinite}
    @keyframes show{to{opacity:1}}
    @keyframes type{to{clip-path:inset(0 0 0 0)}}
    @keyframes blink{50%{opacity:0}}
    @media (prefers-reduced-motion:reduce){.l{opacity:1;animation:none!important}.ty{clip-path:none;animation:none!important}}
  </style>
  <rect width="900" height="572" rx="14" fill="#0d1117"/>
  <rect x=".5" y=".5" width="899" height="572" rx="14" fill="none" stroke="#30363d"/>
  <rect width="900" height="40" rx="14" fill="#161b22"/><rect y="26" width="900" height="14" fill="#161b22"/>
  <circle cx="24" cy="20" r="6" fill="#ff5f57"/><circle cx="44" cy="20" r="6" fill="#febc2e"/><circle cx="64" cy="20" r="6" fill="#28c840"/>
  <text x="450" y="25" text-anchor="middle" fill="#8b949e" style="font-size:13px">OrderGram — demo</text>
<text x="28" y="74" class="l" style="animation:show .01s 0.60s forwards"><tspan fill="#26c76f">❯</tspan></text><text x="50" y="74" class="l ty" style="animation:show .01s 0.60s forwards,type 1.53s steps(34) 0.60s forwards" fill="#e5e7eb">cp config.example.json config.json</text>
<text x="50" y="100" class="l" style="animation:show .01s 2.43s forwards" fill="#94a3b8">Created config.json – edit bot_token and chat_id</text>
<text x="28" y="152" class="l" style="animation:show .01s 3.00s forwards"><tspan fill="#26c76f">❯</tspan></text><text x="50" y="152" class="l ty" style="animation:show .01s 3.00s forwards,type 0.99s steps(22) 3.00s forwards" fill="#e5e7eb">php examples/parse.php</text>
<text x="50" y="178" class="l" style="animation:show .01s 4.29s forwards" fill="#94a3b8">Input: ORDER_PLACED #ORD-9841 Amount: $249.00 Customer: Alice</text>
<text x="50" y="204" class="l" style="animation:show .01s 4.51s forwards" fill="#94a3b8">Parsed order: {&quot;id&quot;:&quot;ORD-9841&quot;,&quot;amount&quot;:249,&quot;currency&quot;:&quot;USD&quot;,&quot;customer&quot;:&quot;Ali…</text>
<text x="50" y="230" class="l" style="animation:show .01s 4.73s forwards" fill="#94a3b8">Order successfully processed</text>
<text x="28" y="282" class="l" style="animation:show .01s 5.30s forwards"><tspan fill="#26c76f">❯</tspan></text><text x="50" y="282" class="l ty" style="animation:show .01s 5.30s forwards,type 1.53s steps(34) 5.30s forwards" fill="#e5e7eb">php bin/ordergram --dry-run --once</text>
<text x="50" y="308" class="l" style="animation:show .01s 7.13s forwards" fill="#94a3b8">OrderGram v1.0 – dry-run mode</text>
<text x="50" y="334" class="l" style="animation:show .01s 7.35s forwards" fill="#94a3b8">Polling chat -987654321...</text>
<text x="50" y="360" class="l" style="animation:show .01s 7.57s forwards" fill="#94a3b8">ORDER_PLACED message matched → dispatched to console</text>
<text x="28" y="412" class="l" style="animation:show .01s 8.14s forwards"><tspan fill="#26c76f">❯</tspan></text><text x="50" y="412" class="l ty" style="animation:show .01s 8.14s forwards,type 1.08s steps(24) 8.14s forwards" fill="#e5e7eb">php bin/ordergram --once</text>
<text x="50" y="438" class="l" style="animation:show .01s 9.52s forwards" fill="#94a3b8">Connected with offset 142</text>
<text x="50" y="464" class="l" style="animation:show .01s 9.74s forwards" fill="#94a3b8">New ORDER_PLACED detected (ORD-9842)</text>
<text x="50" y="490" class="l" style="animation:show .01s 9.96s forwards" fill="#94a3b8">Payload sent to https://example.com/webhook</text>
<g class="l" style="animation:show .01s 10.53s forwards"><text x="28" y="542" fill="#26c76f">❯</text><rect class="cur" x="50" y="527" width="10" height="18" fill="#e5e7eb"/></g>
</svg>
